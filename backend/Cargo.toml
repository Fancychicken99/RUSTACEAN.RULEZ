[package]
name = "secure_crm_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
argon2 = "0.6"
aes-gcm = "0.10.3"
getrandom = "0.3"
zeroize = "1"
sha2 = "0.10"
fs2 = "0.4.3"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
rfd = "0.15"
open = "5"
url = "2"
[dev-dependencies]
tempfile = "3"
