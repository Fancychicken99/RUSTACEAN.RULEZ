name: Publish verified installer downloads
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful native installer build run ID
        required: true
        type: string
      source_sha:
        description: Exact source commit built by that run
        required: true
        type: string
      version:
        description: Release version without v prefix
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify native build and publish its installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/publish-installers.py
