name: Windows and macOS final submission builds

on:
  workflow_dispatch:
  push:
    branches: [dev, "codex/**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            script: package:windows
          - os: macos-15
            platform: macos-universal
            script: package:macos
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup override set 1.99.1
      - name: Install both macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Windows crypto build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: . ./scripts/prepare-windows-build.ps1
      - name: Prepare pinned offline dictation resources
        run: npm run prepare:voice
      - name: Verify packaged UI asset integrity
        run: node scripts/check-ui-assets.cjs
      - name: Backend tests
        run: cargo test --locked --manifest-path backend/Cargo.toml
      - name: Bridge tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Provision WebView2 on disposable Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeSetup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $runtimeSetup
          $installer = Start-Process -FilePath $runtimeSetup -ArgumentList '/silent /install' -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -notin @(0, 3010)) { throw "WebView2 provisioning failed: $($installer.ExitCode)" }
      - name: Windows executable smoke
        if: runner.os == 'Windows'
        env:
          RUSTACEAN_CI_WEBVIEW_POLICY: '1'
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          node scripts/test-desktop-smoke.cjs
      - name: Build native packages
        run: npm run ${{ matrix.script }}
      - name: Windows release launch
        if: runner.os == 'Windows'
        env:
          RUSTACEAN_CI_WEBVIEW_POLICY: '1'
        run: node scripts/test-desktop-smoke.cjs --release-launch-only
      - name: Preserve macOS app metadata
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Hippo Harbor CRM.app" "src-tauri/target/universal-apple-darwin/release/bundle/Hippo-Harbor-CRM-macos-universal.zip"
          lipo "src-tauri/target/universal-apple-darwin/release/bundle/macos/Hippo Harbor CRM.app/Contents/MacOS/rustacean_crm" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "src-tauri/target/universal-apple-darwin/release/bundle/macos/Hippo Harbor CRM.app"
      - name: macOS packaged process launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "src-tauri/target/universal-apple-darwin/release/bundle/macos/Hippo Harbor CRM.app/Contents/MacOS/rustacean_crm" > macos-launch.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 10
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat macos-launch.log
            exit 1
          fi
          echo "Packaged process stayed alive for 10 seconds; full UI acceptance remains a separate check."
      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Hippo-Harbor-CRM-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Hippo-Harbor-CRM-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/*.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Preserve Windows diagnostics on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-smoke-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/rustacean-desktop-smoke-*/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Hippo-Harbor-CRM-windows-x64-${{ github.sha }}
          path: packages/windows
      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: Hippo-Harbor-CRM-macos-universal-${{ github.sha }}
          path: packages/macos
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          windows_installer=$(find packages/windows -type f -name '*-setup.exe' -print -quit)
          macos_dmg=$(find packages/macos -type f -name '*.dmg' -print -quit)
          test -n "$windows_installer"
          test -n "$macos_dmg"
          cp "$windows_installer" "release-assets/Hippo-Harbor-CRM-${GITHUB_REF_NAME#v}-Windows-x64-setup.exe"
          cp "$macos_dmg" "release-assets/Hippo-Harbor-CRM-${GITHUB_REF_NAME#v}-macOS-universal.dmg"
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Hippo Harbor CRM ${{ github.ref_name }}
          body: |
            Hippo Harbor CRM ${{ github.ref_name }} includes the latest app features, the cleaner sidebar, and exact alert day counts.

            Windows x64 installer includes the offline WebView2 installer. macOS package is universal for Apple Silicon and Intel and is ad-hoc signed.
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
